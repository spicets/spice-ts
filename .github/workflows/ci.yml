name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agent-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject new tracked agent logs and planning notes
        env:
          ARTIFACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-agent-artifacts.mjs --base "$ARTIFACT_BASE"
      - run: node --test scripts/check-agent-artifacts.test.mjs

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C packages/core build && pnpm -C packages/circuit-json build

      - name: Offline VDMOS comparison/export regression
        run: pnpm exec tsx --test benchmarks/vdmos-1106/comparison.test.ts

      - run: pnpm lint

      # Keep all 1M deterministic #749/#806 patterns in each required test job.
      # V8 coverage makes this long sweep host-load sensitive (#1054); the
      # coverage suite below retains a 20k prefix and the 20k subnormal sweep.
      - name: Full number-format fuzz (without coverage)
        env:
          SPICE_FULL_NUMBER_FUZZ: '1'
        run: pnpm -C packages/core exec vitest run src/parser/inpevaluate-749.test.ts

      - run: pnpm -r run test:coverage

      # Real Chrome startup must not compete with the parallel coverage workers.
      # Keep this mandatory on both Node versions, not skipped or retried.
      - name: Production browser worker smoke
        run: pnpm -C packages/core exec vitest run src/analysis/step-browser.smoke.test.ts --reporter=default

      - name: Upload core coverage
        if: matrix.node-version == 22
        uses: codecov/codecov-action@v5
        with:
          files: packages/core/coverage/coverage-final.json
          flags: core
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload UI coverage
        if: matrix.node-version == 22
        uses: codecov/codecov-action@v5
        with:
          files: packages/ui/coverage/coverage-final.json
          flags: ui
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          files: packages/core/test-results.xml,packages/ui/test-results.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets status needs main and its common history with the PR.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Check build leaves the tree clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Run examples
        run: pnpm -C examples test

      - name: M2 scaling fixture and deck-hash checks (no timing)
        run: pnpm exec tsx --test benchmarks/performance/scaling-m2.test.ts

      - name: Release plan and comparison policy (no timing)
        run: |
          git show-ref --verify --quiet refs/heads/main || git branch main origin/main
          pnpm exec tsx --test benchmarks/release/then-vs-now.test.ts

      - name: Reference adapter and evidence checks (no simulator install)
        run: pnpm exec tsx --test benchmarks/reference/xyce.test.ts benchmarks/reference/compare.test.ts benchmarks/reference/ekv-static/evidence.test.ts

  bench:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run vitest bench
        run: pnpm bench

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-bench-results
          path: benchmarks/vitest-bench-results.json
          if-no-files-found: ignore

  accuracy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice

      - name: Build @spice-ts/core
        run: pnpm build

      # Explicit offline allowlist. Do not glob in live ngspice/corpus regeneration
      # suites (comparison-harness, corpus-f/triage, differential-noise, buck-boost).
      - name: Fast offline benchmark regressions
        timeout-minutes: 2
        run: |
          pnpm exec tsx --test \
            benchmarks/fine-reference.test.ts \
            benchmarks/performance/scaling-m2.test.ts \
            benchmarks/performance/results/issue-907/check.test.mjs \
            benchmarks/corpus-e-audit/audit.test.mjs \
            benchmarks/device-card-audit/audit.test.ts \
            benchmarks/noacct-options/receipt.test.ts \
            benchmarks/translate/ahkab-to-spice3.test.ts \
            benchmarks/translate/gnucap-to-spice3.test.ts \
            benchmarks/translate/xyce-to-spice3.test.ts \
            benchmarks/corpus/classic/report.test.ts \
            benchmarks/corpus/vendor-published/report.test.ts \
            benchmarks/corpus/classic-b-audit/audit.test.ts \
            benchmarks/corpus/corpus-d/validate.test.mjs \
            benchmarks/corpus/corpus-g/corpus-g.test.ts \
            benchmarks/corpus/corpus-h/corpus-h.test.ts \
            benchmarks/corpus/corpus-i/corpus-i.test.ts \
            benchmarks/corpus/ngspice-bugs/ngspice-bugs.test.ts \
            benchmarks/results/issue-1049/option-audit.test.ts \
            benchmarks/results/issue-355/readme-losses.test.ts \
            benchmarks/results/issue-362/readme-losses.test.ts

      - name: Run accuracy check
        run: npx tsx benchmarks/accuracy.ts --ci

      - name: Smoke differential-noise comparison script
        run: pnpm exec tsx --test benchmarks/differential-noise/compare.test.ts

      - name: Upload accuracy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-results
          path: benchmarks/accuracy-results.json
          if-no-files-found: ignore

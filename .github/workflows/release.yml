name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # npm trusted publishing (OIDC) needs Node >= 22.14 and npm >= 11.5.1. No package cache in release builds.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@^11.5.1 && npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm run version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publishing uses npm trusted publishing (OIDC via id-token: write): no long-lived npm token.
          # Each package needs a trusted publisher on npmjs.com: GitHub Actions, spicets/spice-ts, release.yml.
